name: Update rain data

on:
  schedule:
    - cron: "0 6 1,11,21 * *"     # 06:00 UTC on the 1st, 11th and 21st of each month
  workflow_dispatch:               # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow requests
      - name: Fetch new days
        run: python update_ifs.py
      - name: Rebuild map data
        run: python build_data.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add nl_rain_ifs.parquet docs
          git diff --staged --quiet || (git commit -m "Update rain data" && git push)