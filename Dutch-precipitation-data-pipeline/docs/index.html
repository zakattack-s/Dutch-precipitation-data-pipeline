<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily rainfall in the Netherlands</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#17283a; --panel:rgba(251,251,249,.94); --line:#d9dde2; --accent:#2171b5; }
  html, body { height:100%; margin:0; font:15px/1.4 system-ui, "Segoe UI", sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; background:#e9edf0; }
  .panel { position:absolute; z-index:1000; background:var(--panel); border:1px solid var(--line);
           border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.16); backdrop-filter:blur(6px); }
  #controls { left:50%; bottom:28px; transform:translateX(-50%); width:min(680px, calc(100% - 24px)); padding:12px 16px 14px; }
  #top { display:flex; align-items:center; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; }
  #date { font-size:26px; font-weight:650; letter-spacing:-.01em; }
  #goto { display:flex; align-items:center; gap:6px; font-size:13px; }
  input[type=date] { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid var(--line);
                     border-radius:4px; padding:3px 6px; }
  #row { display:flex; align-items:center; gap:10px; margin-top:8px; }
  #slider { flex:1; accent-color:var(--accent); }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:4px;
           padding:4px 10px; cursor:pointer; }
  button:hover { background:#eef3f8; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #legend { top:12px; right:12px; padding:10px 12px; width:204px; font-size:13px; max-height:calc(100% - 190px); overflow-y:auto; }
  [hidden] { display:none !important; }
  #find { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
  #find label { display:block; margin-top:6px; color:#40505f; }
  #find label.row { display:flex; }
  #find input[type=search] { width:100%; box-sizing:border-box; margin-top:6px; font:inherit; color:var(--ink);
                             border:1px solid var(--line); border-radius:4px; padding:4px 6px; }
  #muniList { margin-top:6px; max-height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:4px;
              background:#fff; padding:2px 6px; }
  #muniList label { display:flex; align-items:center; gap:6px; margin:0; padding:2px 0; color:var(--ink); cursor:pointer; }
  #muniList label.off { display:none; }
  #find .btns { display:flex; gap:6px; margin-top:6px; }
  #find .btns button { flex:1; padding:3px 6px; font-size:12px; }
  #legend b { font-weight:650; }
  #bar { height:10px; border-radius:2px; margin:6px 0 2px; border:1px solid var(--line); }
  #scale { display:flex; justify-content:space-between; color:#40505f; }
  .row { display:flex; align-items:center; gap:6px; margin-top:6px; color:#40505f; }
  .swatch { width:10px; height:10px; border:1px solid var(--line); background:#d0d0d0; }
  #note { margin-top:8px; font-size:11px; line-height:1.3; color:#555; }
  #note a { color:inherit; }

  #find summary { cursor:pointer; font-weight:650; list-style:none; }
  #find summary::-webkit-details-marker { display:none; }
  #find summary::before { content:"▸ "; }
  #find[open] summary::before { content:"▾ "; }
  @media (max-width: 600px) {                       /* phones: smaller panels, picker stays folded */
    #legend { top:8px; right:8px; width:168px; padding:8px 10px; max-height:calc(100% - 170px); }
    #muniList { max-height:110px; }
    #controls { bottom:22px; padding:10px 12px; }
    #date { font-size:22px; }
    #note { margin-top:6px; font-size:10px; }
  }
  .water-label { background:none; border:none; }
  .water-label span { display:inline-block; transform:translate(-50%, -50%); white-space:nowrap;
                      font:italic 600 12px system-ui, sans-serif; letter-spacing:.08em; color:#1b5e59;
                      text-shadow:0 0 2px #fff, 0 0 2px #fff, 0 0 4px #fff, 0 0 4px #fff; }
  .leaflet-tooltip { font:600 13px system-ui, sans-serif; color:var(--ink); border-radius:4px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="legend" class="panel"><b>Rain per day</b>
  <div id="bar"></div><div id="scale"><span>0</span><span>25+ mm</span></div>
  <div class="row"><span class="swatch"></span> no data</div>
  <label id="waterBox" class="row" hidden><input type="checkbox" id="waterToggle" checked> Lakes and rivers</label>
  <details id="find" hidden>
    <summary>Municipalities</summary>
    <input id="muniFilter" type="search" placeholder="Search…" autocomplete="off" aria-label="Search municipalities">
    <div id="muniList"></div>
    <div class="btns"><button id="muniZoom">Zoom to selected</button><button id="muniClear">Clear</button></div>
    <label class="row"><input type="checkbox" id="muniLines"> Show all boundaries</label>
  </details>
</div>
<div id="controls" class="panel">
  <div id="top">
    <div id="date">Loading…</div>
    <div id="goto">
      <label for="pick">Go to date</label>
      <input id="pick" type="date">
      <button id="latest">Latest</button>
    </div>
  </div>
  <div id="row">
    <button id="prev" aria-label="Previous day">‹</button>
    <input id="slider" type="range" min="0" max="0" value="0" aria-label="Date">
    <button id="next" aria-label="Next day">›</button>
  </div>
  <div id="note">Rain: ECMWF IFS model (~8 km cells) via <a href="https://open-meteo.com/">Open-Meteo</a> (CC BY 4.0).
  Map © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors. Lakes and rivers: Natural Earth.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const STOPS = [[247,251,255],[198,219,239],[107,174,214],[33,113,181],[8,48,107]];
const MAX = 25;                                   // mm per day at the darkest color
function color(mm) {
  if (mm < 0) return "#d0d0d0";
  const t = Math.sqrt(Math.min(mm, MAX) / MAX) * (STOPS.length - 1);
  const i = Math.min(Math.floor(t), STOPS.length - 2), f = t - i;
  return "rgb(" + STOPS[i].map((a, k) => Math.round(a + (STOPS[i+1][k] - a) * f)) + ")";
}
document.getElementById("bar").style.background = "linear-gradient(to right," +
  Array.from({length: 11}, (_, i) => color(MAX * (i / 10) ** 2)).join(",") + ")";

const map = L.map("map", {zoomSnap: 0.25}).setView([52.15, 5.4], 7.5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom: 12, opacity: 0.55, attribution: ""}).addTo(map);

map.createPane("outline");
const op = map.getPane("outline"); op.style.zIndex = 620; op.style.pointerEvents = "none";
map.createPane("water"); map.createPane("waterlabels");        // water sits above the rain cells
const wp = map.getPane("water"), wl = map.getPane("waterlabels");
wp.style.zIndex = 450; wl.style.zIndex = 630; wp.style.pointerEvents = wl.style.pointerEvents = "none";
const optional = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
const byName = (a, b) => a[0].localeCompare(b[0], "nl");

function setupWater(W) {                           // GeoJSON; properties.kind is "lake" or "river"
  if (!W) return;
  document.getElementById("waterBox").hidden = false;
  const group = L.layerGroup().addTo(map);
  L.geoJSON(W, {pane: "water", interactive: false, style: f => f.properties.kind === "lake"
    ? {color: "#1b5e59", weight: 1.2, fillColor: "#5fb3ad", fillOpacity: 0.5}
    : {color: "#1b5e59", weight: 2, opacity: 0.9}}).addTo(group);
  [["IJsselmeer", 52.80, 5.40], ["Markermeer", 52.50, 5.25]].forEach(([n, la, lo]) =>
    L.marker([la, lo], {pane: "waterlabels", interactive: false, keyboard: false,
      icon: L.divIcon({className: "water-label", html: "<span>" + n + "</span>", iconSize: null})}).addTo(group));
  document.getElementById("waterToggle").onchange = e => e.target.checked ? group.addTo(map) : map.removeLayer(group);
}
function setupMunis(M) {                           // GeoJSON; each feature has properties.name
  if (!M || !M.features.length) return;
  const box = document.getElementById("find");
  box.hidden = false; box.open = matchMedia("(min-width: 700px)").matches;
  const list = document.getElementById("muniList"), filter = document.getElementById("muniFilter");
  const picked = L.featureGroup().addTo(map), layers = {};          // highlighted municipalities
  const lines = L.geoJSON(M, {pane: "outline", style: {fill: false, color: "#17283a", weight: 0.8, opacity: 0.6}});
  M.features.map((f, i) => [f.properties.name, i]).sort(byName).forEach(([n, i]) => {
    const lab = document.createElement("label");
    lab.innerHTML = '<input type="checkbox"> <span></span>';
    lab.lastChild.textContent = n; lab.dataset.n = n.toLowerCase();
    lab.firstChild.onchange = e => {
      if (e.target.checked) {
        layers[i] = L.geoJSON(M.features[i], {pane: "outline", style: {fill: false, color: "#d9480f", weight: 3}});
        picked.addLayer(layers[i]);
      } else { picked.removeLayer(layers[i]); delete layers[i]; }
    };
    list.appendChild(lab);
  });
  filter.oninput = () => {
    const q = filter.value.trim().toLowerCase();
    list.querySelectorAll("label").forEach(l => l.classList.toggle("off", q !== "" && !l.dataset.n.includes(q)));
  };
  document.getElementById("muniClear").onclick = () => list.querySelectorAll("input:checked").forEach(c => c.click());
  document.getElementById("muniZoom").onclick = () => {             // zoom only when asked
    if (picked.getLayers().length) map.fitBounds(picked.getBounds(), {maxZoom: 12, padding: [40, 40]});
  };
  document.getElementById("muniLines").onchange = e => e.target.checked ? lines.addTo(map) : map.removeLayer(lines);
}

Promise.all([fetch("data.json").then(r => r.json()), fetch("cells.geojson").then(r => r.json()),
             optional("municipalities.geojson"), optional("water.geojson")])
.then(([D, G, munis, water]) => {
  setupMunis(munis); setupWater(water);
  const idx = {}; D.ids.forEach((id, i) => idx[id] = i);
  const slider = document.getElementById("slider"), label = document.getElementById("date"),
        pick = document.getElementById("pick");
  slider.max = D.dates.length - 1; slider.value = slider.max;
  pick.min = D.dates[0]; pick.max = D.dates[D.dates.length - 1];

  const BASE = {weight: 0.4, color: "#fff"};
  const layer = L.geoJSON(G, {
    style: () => ({...BASE, fillOpacity: 0.85, fillColor: "#d0d0d0"}),
    onEachFeature: (f, l) => {
      l.bindTooltip(() => l._mm < 0 ? "No data" : l._mm.toFixed(1) + " mm", {sticky: true});
      l.on({mouseover: () => { l.setStyle({weight: 2, color: "#17283a"}); l.bringToFront(); },
            mouseout: () => l.setStyle(BASE)});
    }
  }).addTo(map);
  map.fitBounds(layer.getBounds());

  function draw() {
    const d = +slider.value;
    pick.value = D.dates[d];
    label.textContent = new Date(D.dates[d] + "T12:00").toLocaleDateString("en-GB",
      {weekday: "short", day: "numeric", month: "long", year: "numeric"});
    layer.eachLayer(l => {
      const i = idx[l.feature.properties.cell_id];
      const v = i === undefined ? -1 : D.v[i][d];
      l._mm = v < 0 ? -1 : v / 10;
      l.setStyle({fillColor: color(l._mm)});
    });
  }
  const step = n => { slider.value = Math.min(+slider.max, Math.max(0, +slider.value + n)); draw(); };
  slider.addEventListener("input", draw);
  pick.addEventListener("change", () => {          // typed or picked date; out-of-range resets to current
    const i = D.dates.indexOf(pick.value);
    if (i >= 0) slider.value = i;
    draw();
  });
  document.getElementById("latest").onclick = () => { slider.value = slider.max; draw(); };
  document.getElementById("prev").onclick = () => step(-1);
  document.getElementById("next").onclick = () => step(1);
  draw();
}).catch(e => { document.getElementById("date").textContent = "Could not load data: " + e.message; });
</script>
</body>
</html>
