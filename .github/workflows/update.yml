name: Update rain data

on:
  schedule:
    - cron: "0 6 1,11,21 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Dutch-precipitation-data-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow requests
      - name: Test connection
        run: curl -sS -m 30 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "https://archive-api.open-meteo.com/v1/archive?latitude=52.1&longitude=5.1&start_date=2026-10-01&end_date=2026-10-02&daily=precipitation_sum&models=ecmwf_ifs"
      - name: Diagnose
        run: |
          B="https://archive-api.open-meteo.com/v1/archive?daily=precipitation_sum&models=ecmwf_ifs&timezone=Europe%2FAmsterdam"
          echo "1 cell, 28 days:"
          curl -sS -m 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$B&latitude=52.1265&longitude=5.1381&start_date=2026-09-29&end_date=2026-10-26"
          echo "10 cells, 28 days:"
          curl -sS -m 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$B&latitude=52.1,52.2,52.3,52.4,52.5,52.6,52.7,52.8,52.9,53.0&longitude=5.1,5.2,5.3,5.4,5.5,5.6,5.7,5.8,5.9,6.0&start_date=2026-09-29&end_date=2026-10-26"
          echo "10 cells, 28 days, IPv4 only:"
          curl -4 -sS -m 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$B&latitude=52.1,52.2,52.3,52.4,52.5,52.6,52.7,52.8,52.9,53.0&longitude=5.1,5.2,5.3,5.4,5.5,5.6,5.7,5.8,5.9,6.0&start_date=2026-09-29&end_date=2026-10-26"
      - name: Fetch new days
        run: python -u update_ifs.py
      - name: Rebuild map data
        run: python build_data.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add nl_rain_ifs.parquet docs
          git diff --staged --quiet || (git commit -m "Update rain data" && git push)

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # latest commit, including the one made above
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Dutch-precipitation-data-pipeline/docs
      - id: deployment
        uses: actions/deploy-pages@v4
