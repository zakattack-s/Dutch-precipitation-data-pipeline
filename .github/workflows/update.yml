name: Update rain data

on:
  schedule:
    - cron: "0 6 1,11,21 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Dutch-precipitation-data-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow requests
      - name: Test connection
        run: curl -sS -m 30 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "https://archive-api.open-meteo.com/v1/archive?latitude=52.1&longitude=5.1&start_date=2026-10-01&end_date=2026-10-02&daily=precipitation_sum&models=ecmwf_ifs"
      - name: Diagnose Python
        run: |
          python -u - <<'EOF'
          import time, subprocess, requests, pandas as pd
          cells = pd.read_parquet("ifs_cells.parquet").iloc[:10]
          p = {"latitude": ",".join(f"{x:.4f}" for x in cells["lat"]),
               "longitude": ",".join(f"{x:.4f}" for x in cells["lon"]),
               "start_date": "2026-09-29", "end_date": "2026-10-26",
               "daily": "precipitation_sum", "models": "ecmwf_ifs",
               "timezone": "Europe/Amsterdam"}
          url = "https://archive-api.open-meteo.com/v1/archive"
          tests = {
              "requests, default headers": {},
              "requests, custom User-Agent": {"User-Agent": "nl-rain-map/1.0 (github.com/YOUR-USERNAME)"},
              "requests, no compression": {"Accept-Encoding": "identity"},
          }
          for name, h in tests.items():
              t = time.time()
              try:
                  r = requests.get(url, params=p, headers=h, timeout=(15, 40))
                  print(name, r.status_code, f"{time.time() - t:.1f}s", len(r.content), "bytes")
              except Exception as e:
                  print(name, "FAILED", type(e).__name__, f"{time.time() - t:.1f}s")
          u = requests.Request("GET", url, params=p).prepare().url
          out = subprocess.run(["curl", "-sS", "-m", "40", "-o", "/dev/null",
                                "-w", "%{http_code} in %{time_total}s", u],
                               capture_output=True, text=True)
          print("curl, exact same URL:", out.stdout, out.stderr[:200])
          EOF      
      - name: Fetch new days
        run: python -u update_ifs.py
      - name: Rebuild map data
        run: python build_data.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add nl_rain_ifs.parquet docs
          git diff --staged --quiet || (git commit -m "Update rain data" && git push)

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # latest commit, including the one made above
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Dutch-precipitation-data-pipeline/docs
      - id: deployment
        uses: actions/deploy-pages@v4
